spring:
  datasource:
    url: jdbc:h2:mem:yep_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

yep:
  jwt:
    secret: unit-test-secret-that-is-definitely-long-enough-0123456789
    expiry-hours: 8
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
