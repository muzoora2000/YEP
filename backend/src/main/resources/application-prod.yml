# Production profile (Render). Schema is owned by Flyway migrations under db/migration.
# DATABASE_URL may be given in postgres:// form - PostgresUrlEnvironmentPostProcessor
# rewrites it to a JDBC URL automatically.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

yep:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  cookie:
    secure: true

server:
  forward-headers-strategy: framework
