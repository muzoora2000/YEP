# Test profile: in-memory H2 (PostgreSQL mode) with the real Flyway migrations.
# spring.jpa.hibernate.ddl-auto=validate proves the SQL migrations match the entities.
spring:
  datasource:
    url: jdbc:h2:mem:yep_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

yep:
  jwt:
    secret: unit-test-secret-that-is-definitely-long-enough-0123456789
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    secure: false
