# Offline demo profile: in-memory H2 running in PostgreSQL compatibility mode.
# Run with: SPRING_PROFILES_ACTIVE=h2  (no external database required)
spring:
  datasource:
    url: jdbc:h2:mem:yep;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

yep:
  cors:
    # Any port on the loopback interface is accepted so `npm run dev -p 3001`
    # or opening the app via 127.0.0.1 does not break registration/login.
    allowed-origins: "${ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}"
  cookie:
    secure: false
